name: Visual smoke

concurrency:
  group: visual-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Plan capture scope
        id: scope
        run: |
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Evq '^(src/photobooth/procedural\.js|src/rooms/r1/heroFish\.js|tools/capture-photo-booth\.mjs|\.github/workflows/visual-smoke\.yml)$'; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Capture scope: full'
          else
            echo 'mode=hero' >> "$GITHUB_OUTPUT"
            echo 'Capture scope: hero'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit
      - name: Start exhibit server
        run: python3 -m http.server 8137 > /tmp/exhibit-server.log 2>&1 &
      - name: Render scenarios
        if: steps.scope.outputs.mode == 'full'
        run: node tools/capture-exhibit.mjs --url=http://127.0.0.1:8137 --scenarios=default,shadowplay --views=hero --settle=1800 --out=evidence/ci-capture
      - name: Render changed hero
        if: steps.scope.outputs.mode == 'hero'
        run: node tools/capture-exhibit.mjs --url=http://127.0.0.1:8137 --scenarios=default --views=hero --settle=700 --out=evidence/ci-capture
      - name: Capture isolated specimens
        if: steps.scope.outputs.mode == 'full'
        run: node tools/capture-photo-booth.mjs --url=http://127.0.0.1:8137 --out=evidence/ci-photo-booth
      - name: Capture changed hero specimen
        if: steps.scope.outputs.mode == 'hero'
        run: node tools/capture-photo-booth.mjs --url=http://127.0.0.1:8137 --files=hero-clownfish.procedural --out=evidence/ci-photo-booth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-smoke-${{ github.sha }}
          path: |
            evidence/ci-capture
            evidence/ci-photo-booth
          if-no-files-found: warn
          retention-days: 14
