name: Visual smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit
      - name: Start exhibit server
        run: python3 -m http.server 8137 > /tmp/exhibit-server.log 2>&1 &
      - name: Render scenarios
        run: node tools/capture-exhibit.mjs --url=http://127.0.0.1:8137 --scenarios=default,shadowplay --views=hero --settle=1800 --out=evidence/ci-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-smoke-${{ github.sha }}
          path: evidence/ci-capture
          if-no-files-found: warn
          retention-days: 14
