<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Exhibit of Shadows</title>
  <style>
    :root{
      --panel:#16191b; --card:#202426; --text:#f1eee6; --muted:#aaa79f;
      --border:#34393c; --accent:#d8c89d; --accent-bg:#ded1ad;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#101214;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:14px}
    .wrap{max-width:1200px;margin:0 auto}
    .view{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:18px;background:#17191a;touch-action:none;user-select:none}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;cursor:crosshair}
    .hud{position:absolute;left:10px;top:10px;z-index:5;max-width:64%;padding:7px 10px;border-radius:10px;background:rgba(15,16,17,.68);color:#f3eee3;font-size:11px;line-height:1.4;pointer-events:none;backdrop-filter:blur(5px)}
    .mode{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:6px}
    .mode button,.action button{min-width:48px;min-height:46px;padding:0 10px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(18,19,20,.68);color:white;font-size:12px;backdrop-filter:blur(5px)}
    .mode button.active{background:rgba(232,214,171,.86);color:#211f1b}
    .joystick{position:absolute;left:14px;bottom:14px;z-index:6;width:102px;height:102px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(18,19,20,.34);touch-action:none}
    .stick{position:absolute;left:31px;top:31px;width:40px;height:40px;border-radius:50%;background:rgba(244,235,213,.76);border:1px solid rgba(255,255,255,.55);pointer-events:none}
    .action{position:absolute;right:12px;bottom:13px;z-index:6;display:grid;grid-template-columns:repeat(2,minmax(48px,1fr));gap:6px}
    .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    button{min-height:44px;padding:0 13px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-size:13px}
    button.primary{border-color:transparent;background:var(--accent-bg);color:#1d1c19}
    .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    fieldset{min-width:0;margin:0;padding:11px;border:1px solid var(--border);border-radius:13px;background:var(--card)}
    legend{padding:0 5px;font-size:13px;font-weight:600;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .ctrl{min-width:0}
    label{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px;font-size:11px;color:var(--muted)}
    output{color:var(--text);font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;min-height:34px;accent-color:var(--accent)}
    .readout{margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);font-size:12px;line-height:1.5;color:var(--muted)}
    .readout strong{color:var(--text)}
    .console{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(8,9,10,.55);backdrop-filter:blur(3px)}
    .console[hidden]{display:none}
    .consoleBox{width:min(94%,560px);max-height:94%;overflow:auto;padding:12px;border:1px solid var(--accent);border-radius:14px;background:rgba(14,16,18,.94)}
    .consoleHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .consoleTitle{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--accent)}
    .consoleSub{font-size:11px;color:var(--muted)}
    .prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:10px;border:1px solid rgba(216,200,157,.55);background:rgba(15,16,17,.8);color:#f3eee3;font-size:12px;pointer-events:none;backdrop-filter:blur(5px)}
    .prompt kbd{padding:1px 6px;border:1px solid rgba(243,238,227,.5);border-radius:5px;font-family:inherit}
    @media(max-width:680px){.controls{grid-template-columns:1fr}.hud{max-width:58%}}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.joystick{width:92px;height:92px}.stick{left:27px;top:27px;width:38px;height:38px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="view">
    <div id="mount" aria-label="Traversable museum hall containing a giant cylindrical aquarium lit by a single central light. Fish shadows are cast radially onto hanging sails and the hall walls: the Exhibit of Shadows."></div>
    <div class="hud" id="hud">Raising the curtainâ€¦</div>

    <div class="mode">
      <button type="button" id="firstBtn" class="active">1st</button>
      <button type="button" id="thirdBtn">3rd</button>
    </div>

    <div class="joystick" id="joystick" aria-label="Movement joystick">
      <div class="stick" id="stick"></div>
    </div>

    <div class="action">
      <button type="button" id="feedAction">Feed</button>
      <button type="button" id="centerAction">Center</button>
    </div>

    <div class="prompt" id="prompt" hidden></div>

    <div class="console" id="consolePanel" hidden>
      <div class="consoleBox">
        <div class="consoleHead">
          <div>
            <div class="consoleTitle">STAGEHAND CONSOLE</div>
            <div class="consoleSub">hall controls Â· guest override</div>
          </div>
          <button type="button" id="consoleClose">Step away</button>
        </div>
        <div class="controls">
          <fieldset>
            <legend>Exhibit</legend>
            <div class="grid">
              <div class="ctrl"><label>Fish <output id="fishCountOut"></output></label><input id="fishCount" type="range" min="6" max="28" value="16"></div>
              <div class="ctrl"><label>Fish activity <output id="activityOut"></output></label><input id="activity" type="range" min="35" max="180" value="100"></div>
              <div class="ctrl"><label>Schooling <output id="schoolingOut"></output></label><input id="schooling" type="range" min="0" max="100" value="64"></div>
              <div class="ctrl"><label>Light pull <output id="lightPullOut"></output></label><input id="lightPull" type="range" min="0" max="200" value="45"></div>
              <div class="ctrl"><label>Plant density <output id="plantsOut"></output></label><input id="plants" type="range" min="0" max="100" value="58"></div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Shadow hall</legend>
            <div class="grid">
              <div class="ctrl"><label>Central light <output id="lightPowerOut"></output></label><input id="lightPower" type="range" min="180" max="1200" value="680" step="10"></div>
              <div class="ctrl"><label>Shadow softness <output id="shadowSoftOut"></output></label><input id="shadowSoft" type="range" min="0" max="100" value="36"></div>
              <div class="ctrl"><label>Gallery light <output id="galleryLightOut"></output></label><input id="galleryLight" type="range" min="0" max="100" value="16"></div>
              <div class="ctrl"><label>Walk speed <output id="walkSpeedOut"></output></label><input id="walkSpeed" type="range" min="40" max="180" value="100"></div>
            </div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button type="button" id="forwardBtn">Forward</button>
    <button type="button" id="backBtn">Back</button>
    <button type="button" id="turnLeftBtn">Turn left</button>
    <button type="button" id="turnRightBtn">Turn right</button>
    <button type="button" class="primary" id="feedBtn">Feed exhibit</button>
    <button type="button" id="playBtn">Shadow play</button>
    <button type="button" id="pauseBtn">Pause</button>
    <button type="button" id="resetPlayerBtn">Return to entrance</button>
  </div>

  <div class="readout" id="readout" aria-live="polite">Initializing exhibit geometryâ€¦</div>
</div>

<script type="module">

/* =====================================================================
   THE EXHIBIT OF SHADOWS Â· v3 â€” Phase 0: room plugin architecture
   Master core owns services, input, the visitor, HUD, and the loop.
   Rooms mount through roomManifest (load order) and talk ONLY via ctx.
   Add a room = one line in roomManifest. Rooms never edit the core.
   Shadows: every non-transparent mesh casts; opt out via userData.noCast.
   ===================================================================== */
(async()=>{
const $=s=>document.querySelector(s),mount=$('#mount'),hud=$('#hud'),readout=$('#readout');
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm');}
catch(e){hud.textContent='Three.js could not load. This demo needs internet access for the Three.js module.';return;}

/* ---------- CORE Â· services ---------- */
const ids=['fishCount','activity','schooling','lightPull','plants','lightPower','shadowSoft','galleryLight','walkSpeed'];
const ui={};for(const id of ids)ui[id]=$('#'+id);
const val=id=>Number(ui[id].value),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111619);
scene.fog=new THREE.FogExp2(0x10171a,.018);

const camera=new THREE.PerspectiveCamera(62,16/9,.08,80);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.04;
renderer.domElement.style.width='100%';
renderer.domElement.style.height='auto';
renderer.domElement.style.aspectRatio='16/9';
mount.appendChild(renderer.domElement);

const state={running:!matchMedia('(prefers-reduced-motion: reduce)').matches,simTime:0,shadowPlay:false,playT:0,consoleOpen:false};
const frameHooks=[],resizeHooks=[],statusHooks=[],consolePoints=[];

const player={group:new THREE.Group(),pos:new THREE.Vector3(0,0,8),spawn:new THREE.Vector3(0,0,8),yaw:0,pitch:0,viewMode:'first',minR:1.2,maxR:9,
  setBounds(min,max){this.minR=min;this.maxR=max;},
  setSpawn(x,z){this.spawn.set(x,0,z);}};
scene.add(player.group);
const shirt=new THREE.MeshStandardMaterial({color:0x435665,roughness:.82});
const skin=new THREE.MeshStandardMaterial({color:0xb18d71,roughness:.9});
const dark=new THREE.MeshStandardMaterial({color:0x282c31,roughness:.8});
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.78,10),shirt);torso.position.y=1.05;torso.castShadow=true;player.group.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.19,12,9),skin);head.position.y=1.62;head.castShadow=true;player.group.add(head);
const legs=[];for(const x of [-.12,.12]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.78,8),dark);leg.position.set(x,.40,0);leg.castShadow=true;player.group.add(leg);legs.push(leg);}
const cameraProp=new THREE.Mesh(new THREE.BoxGeometry(.22,.14,.13),dark);cameraProp.position.set(.27,1.18,-.10);cameraProp.castShadow=true;player.group.add(cameraProp);

function holdButton(el,onStart,onEnd){let p=null;el.addEventListener('pointerdown',e=>{p=e.pointerId;onStart();el.setPointerCapture?.(e.pointerId);});el.addEventListener('pointerup',e=>{if(e.pointerId===p){p=null;onEnd();}});el.addEventListener('pointercancel',()=>{p=null;onEnd();});}

const ctx={THREE,scene,camera,renderer,mount,hud,readout,ui,val,clamp,rnd,pick,state,player,consolePoints,
  onFrame:f=>frameHooks.push(f),onResize:f=>resizeHooks.push(f),registerStatus:f=>statusHooks.push(f),holdButton,$};

/* ---------- CORE Â· input ---------- */
const keys={};let joyX=0,joyY=0;
window.addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys[e.code]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code))keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

let lookPointer=null,lastX=0,lastY=0;
const lookEl=renderer.domElement;
function lockLook(){
  if(state.consoleOpen)return;
  if(!lookEl.requestPointerLock||document.pointerLockElement===lookEl)return;
  try{const p=lookEl.requestPointerLock({unadjustedMovement:true});if(p&&p.catch)p.catch(()=>{try{lookEl.requestPointerLock()}catch(e){}});}
  catch(e){try{lookEl.requestPointerLock()}catch(e2){}}
}
lookEl.addEventListener('pointerdown',e=>{
  if(state.consoleOpen)return;
  if(e.pointerType==='mouse'){lockLook();return;}
  if(nearConsole()){openConsole();return;}
  lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;lookEl.setPointerCapture?.(e.pointerId);
});
lookEl.addEventListener('pointermove',e=>{
  if(document.pointerLockElement===lookEl){player.yaw+=e.movementX*.0026;player.pitch=clamp(player.pitch-e.movementY*.0021,-.95,.95);return;}
  if(e.pointerId!==lookPointer)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw+=dx*.006;player.pitch=clamp(player.pitch-dy*.0048,-.95,.95);
});
lookEl.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null;});
lookEl.addEventListener('pointercancel',()=>{lookPointer=null;});

const joystick=$('#joystick'),stick=$('#stick');let joyPointer=null;
function updateJoy(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,m=Math.hypot(dx,dy)||1,k=Math.min(1,max/m),x=dx*k,y=dy*k;joyX=x/max;joyY=y/max;stick.style.transform='translate('+x+'px,'+y+'px)';}
joystick.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joystick.setPointerCapture?.(e.pointerId);updateJoy(e);});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoy(e);});
function releaseJoy(e){if(joyPointer===null||!e||e.pointerId===joyPointer){joyPointer=null;joyX=0;joyY=0;stick.style.transform='translate(0px,0px)';}}
joystick.addEventListener('pointerup',releaseJoy);joystick.addEventListener('pointercancel',releaseJoy);

holdButton($('#forwardBtn'),()=>keys.KeyW=true,()=>keys.KeyW=false);holdButton($('#backBtn'),()=>keys.KeyS=true,()=>keys.KeyS=false);
holdButton($('#turnLeftBtn'),()=>keys.turnL=true,()=>keys.turnL=false);holdButton($('#turnRightBtn'),()=>keys.turnR=true,()=>keys.turnR=false);

/* ---------- CORE Â· visitor movement & camera ---------- */
function clampPlayer(){const r=Math.hypot(player.pos.x,player.pos.z);if(r<player.minR){const s=player.minR/(r||.001);player.pos.x*=s;player.pos.z*=s;}if(r>player.maxR){const s=player.maxR/r;player.pos.x*=s;player.pos.z*=s;}}
function resetPlayer(){player.pos.copy(player.spawn);player.yaw=0;player.pitch=0;player.group.position.copy(player.pos);}
function forwardVector(){return new THREE.Vector3(Math.sin(player.yaw),0,-Math.cos(player.yaw));}
function rightVector(){return new THREE.Vector3(Math.cos(player.yaw),0,Math.sin(player.yaw));}
function updatePlayer(dt){
  if(state.consoleOpen){legs[0].rotation.x*=.85;legs[1].rotation.x*=.85;return;}
  let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joyY,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joyX;
  const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
  if(Math.abs(f)+Math.abs(s)>.01){
    const speed=2.25*val('walkSpeed')/100;
    player.pos.addScaledVector(forwardVector(),f*speed*dt);
    player.pos.addScaledVector(rightVector(),s*speed*dt);
    clampPlayer();player.group.position.copy(player.pos);
    legs[0].rotation.x=Math.sin(performance.now()*.012)*.35;legs[1].rotation.x=-legs[0].rotation.x;
  }else{legs[0].rotation.x*=.85;legs[1].rotation.x*=.85;}
  player.group.rotation.y=-player.yaw;
}
function updateCamera(){
  const forward=forwardVector(),headPos=player.pos.clone().add(new THREE.Vector3(0,1.62,0));
  if(player.viewMode==='first'){
    player.group.visible=false;camera.position.copy(headPos);
    const look=headPos.clone().add(new THREE.Vector3(Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),-Math.cos(player.yaw)*Math.cos(player.pitch)));camera.lookAt(look);
  }else{
    player.group.visible=true;
    const desired=headPos.clone().addScaledVector(forward,-3.7).add(new THREE.Vector3(0,1.9,0));
    const lim=player.maxR+.38,rr=Math.hypot(desired.x,desired.z);if(rr>lim){desired.x*=lim/rr;desired.z*=lim/rr;}
    camera.position.lerp(desired,.18);
    camera.lookAt(headPos.clone().addScaledVector(forward,1.6).add(new THREE.Vector3(0,.25,0)));
  }
}

/* ---------- CORE Â· stagehand console system ---------- */
const consolePanel=$('#consolePanel'),promptEl=$('#prompt');
function nearConsole(){return consolePoints.length>0&&player.pos.distanceTo(consolePoints[0])<2.6;}
function openConsole(){
  state.consoleOpen=true;consolePanel.hidden=false;
  if(document.pointerLockElement===lookEl)document.exitPointerLock?.();
  for(const k in keys)keys[k]=false;joyX=0;joyY=0;
}
function closeConsole(){state.consoleOpen=false;consolePanel.hidden=true;}
$('#consoleClose').addEventListener('click',closeConsole);
consolePanel.addEventListener('click',e=>{if(e.target===consolePanel)closeConsole();});
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'&&state.consoleOpen)closeConsole();
  else if(e.code==='KeyE'&&!e.repeat){if(state.consoleOpen)closeConsole();else if(nearConsole())openConsole();}
});

/* ---------- CORE Â· mode, reset, pause ---------- */
function setMode(mode){player.viewMode=mode;$('#firstBtn').classList.toggle('active',mode==='first');$('#thirdBtn').classList.toggle('active',mode==='third');}
$('#firstBtn').addEventListener('click',()=>setMode('first'));$('#thirdBtn').addEventListener('click',()=>setMode('third'));
$('#resetPlayerBtn').addEventListener('click',resetPlayer);
$('#pauseBtn').addEventListener('click',e=>{state.running=!state.running;e.currentTarget.textContent=state.running?'Pause':'Play';});

function refreshCoreOutputs(){$('#walkSpeedOut').value=(val('walkSpeed')/100).toFixed(2)+'Ã—';}
ui.walkSpeed.addEventListener('input',refreshCoreOutputs);

/* ---------- CORE Â· resize, HUD, loop ---------- */
function resize(){const r=mount.getBoundingClientRect(),w=Math.max(320,r.width),h=w*9/16;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();for(const f of resizeHooks)f(w);}
new ResizeObserver(resize).observe(mount);

const desktopPointer=matchMedia('(hover:hover) and (pointer:fine)').matches;
function updateHud(){
  const r=Math.hypot(player.pos.x,player.pos.z);
  if(state.consoleOpen){promptEl.hidden=false;promptEl.innerHTML='<kbd>E</kbd> / <kbd>ESC</kbd> â€” step away';}
  else if(nearConsole()){promptEl.hidden=false;promptEl.innerHTML=desktopPointer?'<kbd>E</kbd> â€” Stagehand console':'You approach the stagehand console';}
  else promptEl.hidden=true;
  const lookHint=desktopPointer?(document.pointerLockElement===lookEl?' Â· ESC frees the mouse':' Â· click scene for mouse-look'):'';
  let text=(state.shadowPlay?'SHADOW PLAY Â· ':'')+'Exhibit of Shadows Â· '+(player.viewMode==='first'?'first-person':'third-person');
  for(const f of statusHooks)text+=' Â· '+f();
  hud.textContent=text+' Â· radial '+r.toFixed(1)+' m'+lookHint;
}

let last=performance.now(),metricClock=0;
function frame(now){
  const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;
  if(!state.consoleOpen){if(keys.turnL)player.yaw-=dt*1.4;if(keys.turnR)player.yaw+=dt*1.4;}
  if(state.running){
    state.simTime+=dt;updatePlayer(dt);
    for(const f of frameHooks)f(dt,state.simTime);
  }
  updateCamera();metricClock+=dt;
  if(metricClock>.25){metricClock=0;updateHud();}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}

/* ---------- CORE Â· shadow discipline ----------
   Every non-transparent mesh blocks light. Transparent materials (glass,
   water, beam, sheer sail cloth) and userData.noCast exemptions do not. */
function applyShadowCasting(){
  scene.traverse(o=>{
    if(o.isMesh&&!o.castShadow&&!o.userData.noCast){
      const m=o.material,tx=Array.isArray(m)?m.some(x=>x.transparent):m.transparent;
      if(!tx)o.castShadow=true;
    }
  });
}

/* ---------- ROOM PLUGINS (load order â€” plugins.txt) ---------- */
const roomManifest=[
  {id:'r1-gallery-one',mount:buildGalleryOne},
  {id:'demo-room',mount:()=>{}},
];
for(const room of roomManifest)room.mount(ctx);
applyShadowCasting();
resize();refreshCoreOutputs();resetPlayer();setMode('first');
if(!state.running)$('#pauseBtn').textContent='Play';
updateHud();requestAnimationFrame(frame);

/* =====================================================================
   ROOM r1-gallery-one Â· "The Exhibit of Shadows" â€” master exhibit hall
   ===================================================================== */
function buildGalleryOne(ctx){
  const {THREE,scene,ui,val,clamp,rnd,pick,state,player,consolePoints,onFrame,onResize,registerStatus,$}=ctx;
  const root=new THREE.Group();scene.add(root);
  const HALL_R=10.8,HALL_H=12.8,TANK_R=3.15,TANK_H=8.6,TANK_CENTER_Y=4.55,LIGHT_COLUMN_R=.48;
  player.setBounds(TANK_R+.82,HALL_R-.68);player.setSpawn(0,HALL_R-2.0);

  /* R1.A architecture */
  const wallMat=new THREE.MeshStandardMaterial({color:0xa09a8c,roughness:.94,side:THREE.BackSide});
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(HALL_R,HALL_R,HALL_H,72,1,true),wallMat);
  wall.position.y=HALL_H/2;wall.receiveShadow=true;wall.userData.noCast=true;root.add(wall);

  const floorMat=new THREE.MeshStandardMaterial({color:0x413c35,roughness:.9});
  const floor=new THREE.Mesh(new THREE.CircleGeometry(HALL_R,72),floorMat);
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.userData.noCast=true;root.add(floor);

  const ceiling=new THREE.Mesh(new THREE.CircleGeometry(HALL_R,72),new THREE.MeshStandardMaterial({color:0x8d887d,roughness:1,side:THREE.DoubleSide}));
  ceiling.rotation.x=Math.PI/2;ceiling.position.y=HALL_H;ceiling.receiveShadow=true;ceiling.userData.noCast=true;root.add(ceiling);

  const ribMat=new THREE.MeshStandardMaterial({color:0x716d65,roughness:.86});
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    const rib=new THREE.Mesh(new THREE.BoxGeometry(.23,HALL_H*.82,.32),ribMat);
    rib.position.set(Math.sin(a)*(HALL_R-.13),HALL_H*.46,Math.cos(a)*(HALL_R-.13));
    rib.rotation.y=a;rib.receiveShadow=true;root.add(rib);
  }

  const balconyMat=new THREE.MeshStandardMaterial({color:0x494946,roughness:.85,metalness:.10});

    for(const l of lamps)l.intensity=state.shadowPlay?.07:.55;
  }
  function setShadowPlay(on){
    state.shadowPlay=on;state.playT=0;
    $('#playBtn').textContent=on?'Stop the play':'Shadow play';
    $('#playBtn').style.borderColor=on?'#d8c89d':'';
    if(!on){centralLight.intensity=centralBase;orbMat.emissiveIntensity=4;}
    applyGallery();
  }
  $('#feedAction').addEventListener('click',feedExhibit);$('#feedBtn').addEventListener('click',feedExhibit);
  $('#centerAction').addEventListener('click',()=>{player.yaw=Math.atan2(-player.pos.x,player.pos.z);player.pitch=.05;});
  $('#playBtn').addEventListener('click',()=>setShadowPlay(!state.shadowPlay));

  function refreshExhibitOutputs(){
    $('#fishCountOut').value=val('fishCount');
    $('#activityOut').value=(val('activity')/100).toFixed(2)+'Ã—';
    $('#schoolingOut').value=(val('schooling')/100).toFixed(2);
    $('#lightPullOut').value=(val('lightPull')/100).toFixed(2)+'Ã—';
    $('#plantsOut').value=(val('plants')/100).toFixed(2);
    $('#lightPowerOut').value=val('lightPower').toFixed(0);
    $('#shadowSoftOut').value=(val('shadowSoft')/100).toFixed(2);
    $('#galleryLightOut').value=(val('galleryLight')/100).toFixed(2);
  }
  ui.fishCount.addEventListener('input',()=>{syncFish();refreshExhibitOutputs();});
  ui.activity.addEventListener('input',refreshExhibitOutputs);
  ui.schooling.addEventListener('input',refreshExhibitOutputs);
  ui.lightPull.addEventListener('input',refreshExhibitOutputs);
  ui.plants.addEventListener('input',()=>{buildHabitat();refreshExhibitOutputs();});
  ui.lightPower.addEventListener('input',()=>{centralBase=val('lightPower');if(!state.shadowPlay)centralLight.intensity=centralBase;refreshExhibitOutputs();});
  ui.shadowSoft.addEventListener('input',()=>{centralLight.shadow.radius=1+val('shadowSoft')/12;refreshExhibitOutputs();});
  ui.galleryLight.addEventListener('input',()=>{applyGallery();refreshExhibitOutputs();});

  onResize(w=>{const s=w<620?512:1024;if(centralLight.shadow.mapSize.x!==s){centralLight.shadow.mapSize.set(s,s);if(centralLight.shadow.map){centralLight.shadow.map.dispose();centralLight.shadow.map=null;}}});
  onFrame((dt,t)=>{
    if(state.shadowPlay){state.playT+=dt;const breath=.78+.20*Math.sin(state.playT*1.25)+.06*Math.sin(state.playT*4.3);centralLight.intensity=centralBase*breath;orbMat.emissiveIntensity=2.2+2.6*breath;}
    updateMotes(dt);
    for(const f of fish)updateFish(f,dt,t);
    for(const food of [...foods])updateFood(food,dt);
  });
  registerStatus(()=>fish.length+' minnows Â· '+fish.filter(f=>f.state==='feed').length+' feeding');

  readout.innerHTML='<strong>The Exhibit of Shadows.</strong> A single shadow-casting PointLight burns at the heart of the tank â€” the only instrument in the hall. Its six-direction shadow map throws every minnow, plant, and visitor onto eight hanging sails, the gallery wall, floor, and ceiling. Physics bends around the core: the <em>Light pull</em> slider tugs the school into orbit like moths, and <em>Shadow play</em> dims the gallery, sets the core breathing, and winds the fish into a slow vortex of silhouettes. All hall controls live at the stagehand console by the far wall.';

  buildHabitat();syncFish();refreshExhibitOutputs();
  centralBase=val('lightPower');centralLight.intensity=centralBase;centralLight.shadow.radius=1+val('shadowSoft')/12;applyGallery();
  return{root};
}
})();
</script>
</body>
</html>
