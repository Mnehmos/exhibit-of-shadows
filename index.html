<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Exhibit of Shadows</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A0%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --panel:#16191b; --card:#202426; --text:#f1eee6; --muted:#aaa79f;
      --border:#34393c; --accent:#d8c89d; --accent-bg:#ded1ad;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#101214;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:14px}
    .wrap{max-width:1200px;margin:0 auto}
    .view{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:18px;background:#17191a;touch-action:none;user-select:none}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;cursor:crosshair}
    .hud{position:absolute;left:10px;top:10px;z-index:5;max-width:64%;padding:7px 10px;border-radius:10px;background:rgba(15,16,17,.68);color:#f3eee3;font-size:11px;line-height:1.4;pointer-events:none;backdrop-filter:blur(5px)}
    .mode{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:6px}
    .mode button,.action button{min-width:48px;min-height:46px;padding:0 10px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(18,19,20,.68);color:white;font-size:12px;backdrop-filter:blur(5px)}
    .mode button.active{background:rgba(232,214,171,.86);color:#211f1b}
    .joystick{position:absolute;left:14px;bottom:14px;z-index:6;width:102px;height:102px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(18,19,20,.34);touch-action:none}
    .stick{position:absolute;left:31px;top:31px;width:40px;height:40px;border-radius:50%;background:rgba(244,235,213,.76);border:1px solid rgba(255,255,255,.55);pointer-events:none}
    .action{position:absolute;right:12px;bottom:13px;z-index:6;display:grid;grid-template-columns:repeat(2,minmax(48px,1fr));gap:6px}
    .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    button{min-height:44px;padding:0 13px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-size:13px}
    button.primary{border-color:transparent;background:var(--accent-bg);color:#1d1c19}
    .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    fieldset{min-width:0;margin:0;padding:11px;border:1px solid var(--border);border-radius:13px;background:var(--card)}
    legend{padding:0 5px;font-size:13px;font-weight:600;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .ctrl{min-width:0}
    label{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px;font-size:11px;color:var(--muted)}
    output{color:var(--text);font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;min-height:34px;accent-color:var(--accent)}
    .readout{margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);font-size:12px;line-height:1.5;color:var(--muted)}
    .readout strong{color:var(--text)}
    .console{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(8,9,10,.55);backdrop-filter:blur(3px)}
    .console[hidden]{display:none}
    .consoleBox{width:min(94%,560px);max-height:94%;overflow:auto;padding:12px;border:1px solid var(--accent);border-radius:14px;background:rgba(14,16,18,.94)}
    .consoleHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .consoleTitle{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--accent)}
    .consoleSub{font-size:11px;color:var(--muted)}
    .prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:10px;border:1px solid rgba(216,200,157,.55);background:rgba(15,16,17,.8);color:#f3eee3;font-size:12px;pointer-events:none;backdrop-filter:blur(5px)}
    .prompt kbd{padding:1px 6px;border:1px solid rgba(243,238,227,.5);border-radius:5px;font-family:inherit}
    @media(max-width:680px){.controls{grid-template-columns:1fr}.hud{max-width:58%}}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.joystick{width:92px;height:92px}.stick{left:27px;top:27px;width:38px;height:38px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="view">
    <div id="mount" aria-label="Traversable museum hall containing a giant cylindrical aquarium lit by a single central light. Fish shadows are cast radially onto hanging sails and the hall walls: the Exhibit of Shadows."></div>
    <div class="hud" id="hud">Raising the curtain…</div>

    <div class="mode">
      <button type="button" id="firstBtn" class="active">1st</button>
      <button type="button" id="thirdBtn">3rd</button>
    </div>

    <div class="joystick" id="joystick" aria-label="Movement joystick">
      <div class="stick" id="stick"></div>
    </div>

    <div class="action">
      <button type="button" id="feedAction">Feed</button>
      <button type="button" id="centerAction">Center</button>
    </div>

    <div class="prompt" id="prompt" hidden></div>

    <div class="console" id="consolePanel" hidden>
      <div class="consoleBox">
        <div class="consoleHead">
          <div>
            <div class="consoleTitle">STAGEHAND CONSOLE</div>
            <div class="consoleSub">hall controls · guest override</div>
          </div>
          <button type="button" id="consoleClose">Step away</button>
        </div>
        <div class="controls" id="consoleGroups"></div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button type="button" id="forwardBtn">Forward</button>
    <button type="button" id="backBtn">Back</button>
    <button type="button" id="turnLeftBtn">Turn left</button>
    <button type="button" id="turnRightBtn">Turn right</button>
    <button type="button" class="primary" id="feedBtn">Feed exhibit</button>
    <button type="button" id="playBtn">Shadow play</button>
    <button type="button" id="pauseBtn">Pause</button>
    <button type="button" id="resetPlayerBtn">Return to entrance</button>
  </div>

  <div class="readout" id="readout" aria-live="polite">Initializing exhibit geometry…</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
